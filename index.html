<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پورتال جلسات MCSE</title>
    
    <!-- Vazirmatn Font -->
    <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        accent: '#00e5ff',
                        accentHover: '#84ffff',
                        darkBg: '#050b14',
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Dark Theme & Background Pattern */
        body {
            font-family: 'Vazirmatn', sans-serif !important;
            background-color: #050b14;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(0, 229, 255, 0.05) 0%, transparent 60%);
            background-attachment: fixed;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* انیمیشن برای گوی‌های درخشان پس‌زمینه */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }
        
        .animation-delay-4000 {
            animation-delay: 4s;
        }

        /* انیمیشن ورود کارت‌ها به صفحه */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .episode-card {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        /* Glassmorphism Panel Base for Cards */
        .glass-card {
            background: rgba(30, 30, 35, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 229, 255, 0.15);
        }
    </style>
</head>

<body class="min-h-screen relative text-slate-200 flex flex-col items-center justify-center py-12 px-4 sm:px-6 lg:px-8">

    <!-- افکت‌های نوری معلق در پس‌زمینه با تم فیروزه‌ای -->
    <div class="fixed inset-0 w-full h-full overflow-hidden -z-10 flex items-center justify-center pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-accent/20 rounded-full mix-blend-screen filter blur-[100px] animate-blob"></div>
        <div class="absolute top-[20%] left-[-10%] w-96 h-96 bg-accent/10 rounded-full mix-blend-screen filter blur-[100px] animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-[500px] h-[500px] bg-accent/5 rounded-full mix-blend-screen filter blur-[120px] animate-blob animation-delay-4000"></div>
    </div>

    <div class="max-w-5xl w-full flex flex-col items-center z-10">
        <div class="text-center mb-16 animate-[fadeUp_0.8s_ease-out]">
            <div class="inline-flex items-center justify-center px-4 py-1.5 mb-6 rounded-full border border-accent/40 bg-accent/10 backdrop-blur-md shadow-[0_0_15px_rgba(0,229,255,0.15)]">
                <span class="text-accent text-sm font-semibold tracking-wider">دسترسی سریع به منابع</span>
            </div>
            <h1 class="text-4xl md:text-6xl font-black mb-4 tracking-tight text-white drop-shadow-lg">
                پورتال جلسات <span class="text-accent drop-shadow-[0_0_15px_rgba(0,229,255,0.5)]">MCSE</span>
            </h1>
            <p class="text-gray-400 text-lg md:text-xl font-light max-w-2xl mx-auto">
                جهت ورود به هر بخش، اپیزود مورد نظر خود را از لیست زیر انتخاب کنید.
            </p>
        </div>

        <!-- تغییر اصلی: گرید ۴ ستونه برای دسکتاپ و ۲ ستونه برای موبایل جهت تقارن کامل برای ۱۶ آیتم -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 w-full max-w-4xl mx-auto" id="episodes-grid">
            <!-- کارت‌ها در اینجا توسط جاوااسکریپت تزریق می‌شوند -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('episodes-grid');
            
            // تنظیمات تعداد اپیزودها
            const startEpisode = 1; 
            const totalEpisodes = 16; 
            
            // ساختار URL
            const baseUrl = './episodes/e';
            const domain = '.html';

            // تولید کارت‌ها
            for (let i = startEpisode; i <= totalEpisodes; i++) {
                const a = document.createElement('a');
                
                // تنظیم لینک
                a.href = `${baseUrl}${i}${domain}`;
                
                // اعمال کلاس‌های گلس‌مورفیسم و نئونی فیروزه‌ای برای کارت‌ها
                a.className = `
                    episode-card glass-card group relative overflow-hidden rounded-2xl p-6
                    flex flex-col items-center justify-center gap-2
                    transition-all duration-300 ease-out cursor-pointer
                    hover:-translate-y-2 hover:bg-[rgba(40,40,45,0.6)] hover:border-accent 
                    hover:shadow-[0_0_25px_rgba(0,229,255,0.3)]
                `;
                
                // ایجاد تاخیر تدریجی در انیمیشن ورود
                a.style.animationDelay = `${i * 0.05}s`; 
                
                // محتوای داخلی کارت
                a.innerHTML = `
                    <!-- افکت نور پس‌زمینه ظریف هنگام هاور -->
                    <div class="absolute inset-0 bg-gradient-to-b from-transparent to-accent/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                    
                    <span class="text-sm font-medium text-gray-400 group-hover:text-accent transition-colors z-10">اپیزود</span>
                    
                    <strong class="text-5xl font-black text-white group-hover:text-transparent group-hover:bg-clip-text group-hover:bg-gradient-to-r group-hover:from-white group-hover:to-accent transition-all z-10">
                        ${i}
                    </strong>
                    
                    <!-- آیکون ورود که هنگام هاور نمایش داده می‌شود -->
                    <div class="absolute bottom-3 opacity-0 transform translate-y-4 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 z-10">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-accent">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                            <polyline points="10 17 15 12 10 7"></polyline>
                            <line x1="15" y1="12" x2="3" y2="12"></line>
                        </svg>
                    </div>
                `;
                
                grid.appendChild(a);
            }
        });
    </script>
</body>
</html>
